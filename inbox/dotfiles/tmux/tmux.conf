# Check https://github.com/gpakosz/.tmux
# Ref: https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# Prefix: C-s
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Split panes
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Copy mode
bind y copy-mode
bind p paste-buffer

setw -g monitor-activity on

# Pane navigation (Alt+vim)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize two side-by-side panes to 1:2 ratio (left:right)
bind 2 resize-pane -t 0 -x "33%"

# Window navigation
bind -n M-, previous-window
bind -n M-. next-window
bind < swap-window -t -1
bind > swap-window -t +1

# Session switching
bind -n M-< switch-client -p
bind -n M-> switch-client -n
bind s choose-tree -s

# Direct window select
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# https://www.johnhawthorn.com/2012/09/vi-escape-delays/
set -s escape-time 0

# Mouse support
run-shell 'tmux setenv -g TMUX_VERSION $(tmux -V | sed -En "s/^tmux[^0-9]*([.0-9]+).*/\1/p")'

# copy and paste
# ref: https://www.rushiagr.com/blog/2016/06/16/everything-you-need-to-know-about-tmux-copy-pasting-ubuntu/
#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi y send-keys -X copy-selection
#bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# bind-key syntax changed in 2.4 -- selection / copy / paste
if-shell -b '[ "$(echo "$TMUX_VERSION < 2.4" | bc)" = 1 ]' \
    'bind-key -t vi-copy v   begin-selection; \
    bind-key -t vi-copy C-v rectangle-toggle; \
    bind-key -t vi-copy y   copy-pipe "xclip -selection clipboard -in"'

if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' \
    'bind-key -T copy-mode-vi v   send -X begin-selection; \
    bind-key -T copy-mode-vi V   send -X select-line; \
    bind-key -T copy-mode-vi C-v send -X rectangle-toggle; \
    bind-key -T copy-mode-vi y   send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

if-shell -b '[ "$(echo "$TMUX_VERSION < 2.1" | bc)" = 1 ]' \
    'set -g mouse-select-pane on; set -g mode-mouse on; \
    set -g mouse-resize-pane on; set -g mouse-select-window on'

if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.1" | bc)" = 1 ]' \
    'set -g mouse on'

# set-option -ga terminal-overrides ",xterm-256color:Tc"

# This allows Kitty's image protocol sequences to pass through tmux directly to the underlying terminal, rather than being interpreted or modified by tmux.
# set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# Enable truecolor & proper terminal overrides
#set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-kitty:Tc'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
# Enable RGB for inner terminals
set-option -ga terminal-overrides ",*:RGB"

# Enable OSC 52 clipboard support for copying over SSH
set -g set-clipboard on


# Make backspace capability DEL (0x7f)
set -ga terminal-overrides ',*:kbs=\177'

set-option -g status-position top

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin '/Users/cche/git/tmux-pomodoro-plus'
#set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @plugin 'fabioluciano/tmux-tokyo-night'
#set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
#set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
#set -g @plugin 'erikw/tmux-powerline'
#set -g @plugin 'niksingh710/minimal-tmux-status'

#set -g @resurrect-capture-pane-contents 'on'
#set -g @continuum-restore 'on'

#----- pomodoro -----
set -g @pomodoro_mins 55                       # The duration of the Pomodoro
set -g @pomodoro_break_mins 5                  # The duration of the break after the Pomodoro completes
set -g @pomodoro_intervals 3                   # The number of intervals before a longer break is started
set -g @pomodoro_long_break_mins 20            # The duration of the long break
set -g @pomodoro_repeat 'off'                  # Automatically repeat the Pomodoros?
set -g @pomodoro_disable_breaks 'off'          # Turn off breaks
set -g @pomodoro_sound 'Glass'                   # Sound for desktop notifications (Run `ls /System/Library/Sounds` for a list of sounds to use on Mac)
set -g @pomodoro_notifications 'off'           # desktop notifications from your terminal
set -g @pomodoro_notifications_on_completion 'on' # Enable notifications only on completion
set -g @pomodoro_granularity 'off'             # Enables MM:SS (ex: 00:10) format instead of the default (ex: 1m)

#----- catppuccin plugin -----
# Set flavor based on ~/.lighttheme (managed by toggle-theme); default is dark
if-shell '[ -f "$HOME/.lighttheme" ]' \
  'set -g @catppuccin_flavor "latte"' \
  'set -g @catppuccin_flavor "mocha"'
set -g @catppuccin_window_status_style "rounded"

# Show directory basename in window tabs
set -g @catppuccin_window_text " #W:#{b:pane_current_path}"
set -g @catppuccin_window_current_text " #W:#{b:pane_current_path}"

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Persist manual window renames (prefix ,) - disable shell from overwriting
setw -g automatic-rename off

# Status line - set BEFORE TPM so tmux-pomodoro-plus can find #{pomodoro_status} and replace it
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_host}"
set -ag status-left "#{E:@catppuccin_status_session}"
set -ag status-left "   "
# #{pomodoro_status} must be literal; plugin replaces it when TPM loads
set -g status-right "#{pomodoro_status}"
set -ag status-right " #{E:@catppuccin_status_directory}"
set -ag status-right " #{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_gitmux}" # no need; my zsh status line has git status
#set -agF status-right "#{E:@catppuccin_status_cpu}"
#set -ag status-right "#{E:@catppuccin_status_uptime}"
#set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TMUX plugin manager (must run AFTER status-right is set)
run '~/.config/tmux/plugins/tpm/tpm'


# Enable mouse support
set -g mouse on

# Highlight active pane: dim inactive panes, brighten active pane
#set -g window-style 'fg=colour240,bg=default'
#set -g window-active-style 'fg=default,bg=default'
set -g pane-border-status off
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour75,bold'

# Use pbcopy for system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# quick switch to session-tab
bind-key M-j run-shell "tmux switch-client -t main:0 || tmux switch-client -t main"
bind-key M-k run-shell "tmux switch-client -t main:1 || tmux switch-client -t main"

