# ~/.config/kitty/kitty.conf

# clear_all_shortcuts yes

macos_option_as_alt yes

term xterm-256color

kitty_mod super

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# --- tabs ---

# kitty_mod+. conflicts with GNOME's emoji picker (Super+.) on Ubuntu/Linux.
# ctrl+pageup/pagedown are cross-platform alternatives.
map kitty_mod+, previous_tab
map kitty_mod+. next_tab
map ctrl+page_up previous_tab
map ctrl+page_down next_tab

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0>kitty_mod+0 goto_tab 10
map kitty_mod+0>kitty_mod+1 goto_tab 11
map kitty_mod+0>kitty_mod+2 goto_tab 12
map kitty_mod+0>kitty_mod+3 goto_tab 13
map kitty_mod+0>kitty_mod+4 goto_tab 14
map kitty_mod+0>kitty_mod+5 goto_tab 15
map kitty_mod+0>kitty_mod+6 goto_tab 16
map kitty_mod+0>kitty_mod+7 goto_tab 17
map kitty_mod+0>kitty_mod+8 goto_tab 18
map kitty_mod+0>kitty_mod+9 goto_tab 19

map kitty_mod+shift+. move_tab_forward
map kitty_mod+shift+, move_tab_backward

# --- windows (panes) ---

# Horizontal and vertical split is not controlable
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_window
# same as kitty_mod+enter
map f1 new_window_with_cwd
# cycle through layouts
map f2 layout_action rotate 
# Visually swap window with another
map f3 swap_with_window
enabled_layouts splits
map ctrl+- launch --location=hsplit --cwd=current
map ctrl+\ launch --location=vsplit --cwd=current

# Navigate between windows (panes)
# Note: alt+h/j/k/l are NOT mapped here so they pass through to tmux
# Use kitty_mod (Command) for Kitty window navigation instead
map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right
map kitty_mod+k neighboring_window up
map kitty_mod+j neighboring_window down
# map kitty_mod+shift+y launch --type=overlay kitten hints --type=tab
# map kitty_mod+shift+u launch --type=overlay kitten hints --type=window

# resize window
map kitty_mod+shift+h resize_window narrower
map kitty_mod+shift+l resize_window wider
map kitty_mod+shift+k resize_window taller
map kitty_mod+shift+j resize_window shorter

map kitty_mod+shift+up move_window up
map kitty_mod+shift+left move_window left
map kitty_mod+shift+right move_window right
map kitty_mod+shift+down move_window down

# Close pane
map kitty_mod+w close_window 

map kitty_mod+f2 detach_window
map kitty_mod+f3 move_window_to_tab

# sessions
#map f5 save_as_session --use-foreground-process --relocatable
map f5 save_as_session --base-dir ~/.config/kitty/

# ============================================================================
# THEMES. Managed by auto theme
# ============================================================================
#include current-theme.conf
include default-theme.conf
active_border_color     #40E0D0

# ============================================================================
# BASIC APPEARANCE
# ============================================================================

# Font
font_family JetBrains Mono
# font_family MesloLGS NF
font_size 13.0

# Cursor
cursor_shape block
cursor_blink_interval 0

# Window
window_padding_width 8
window_border_width 2px
hide_window_decorations titlebar-only
remember_window_title_for_tabs yes

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{index}: {title}"

# ============================================================================
# MISC
# ============================================================================

# Shell integration
shell_integration enabled

# Confirm before closing
confirm_os_window_close 1

env TERM=xterm-kitty

# Sessions

map ctrl+b>q goto_session ~/softwares/quokka/quokka/launch.kitty-session

# Bring up the interactive tab picker menu instantly:
map kitty_mod+f4 detach_window new-tab

